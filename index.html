<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeonAnime | Futuristic Anime Streaming</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- ArtPlayer and Hls.js -->
    <script src="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --neon-blue: #00f7ff;
            --neon-purple: #b400ff;
            --dark-bg: #0a0a0f;
            --darker-bg: #050508;
            --card-bg: #111118;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--dark-bg);
            color: #e0e0e0;
            overflow-x: hidden;
        }
        
        .futuristic-font { font-family: 'Orbitron', sans-serif; }
        .neon-text-blue { text-shadow: 0 0 5px var(--neon-blue), 0 0 10px var(--neon-blue); color: var(--neon-blue); }
        .neon-text-purple { text-shadow: 0 0 5px var(--neon-purple), 0 0 10px var(--neon-purple); color: var(--neon-purple); }
        .shadow-neon-blue { box-shadow: 0 0 20px rgba(0, 247, 255, 0.3); }
        
        .grid-lines {
            background-image: 
                linear-gradient(rgba(180, 0, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(180, 0, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        .anime-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .anime-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 10px 25px rgba(180, 0, 255, 0.3);
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1a1a2e; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--neon-purple); border-radius: 10px; }
        
        #player-container {
            border: 1px solid rgba(0, 247, 255, 0.2);
        }
    </style>
</head>
<body class="grid-lines min-h-screen">
    <!-- Nav -->
    <nav class="bg-black/80 backdrop-blur-lg fixed w-full z-50 border-b border-purple-900/50">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fas fa-rocket text-2xl neon-text-blue"></i>
                <a href="/" class="futuristic-font text-2xl font-bold neon-text-purple">NEON<span class="neon-text-blue">ANIME</span></a>
            </div>

            <div class="flex items-center space-x-4">
                <div class="relative group">
                    <input type="text" id="searchInput" placeholder="Search anime..."
                           class="bg-gray-900/80 text-white px-5 py-2 rounded-full border border-purple-500/30 focus:outline-none focus:ring-2 focus:ring-purple-500 w-48 md:w-80 transition-all">
                    <button id="searchBtn" class="absolute right-4 top-2.5 text-gray-400 group-hover:text-purple-400">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero / Featured -->
    <section id="heroSection" class="pt-32 pb-16 px-6">
        <div class="container mx-auto" id="featuredAnime">
            <!-- Featured content injected by JS -->
        </div>
    </section>

    <!-- Search Results (Hidden by default) -->
    <section id="searchResultsSection" class="hidden py-12 px-6 bg-black/40">
        <div class="container mx-auto">
            <h2 class="futuristic-font text-3xl font-bold neon-text-blue mb-8">SEARCH RESULTS</h2>
            <div id="searchResultsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6"></div>
        </div>
    </section>

    <!-- Trending -->
    <main class="container mx-auto px-6 py-12">
        <div class="mb-16">
            <h2 class="futuristic-font text-3xl font-bold neon-text-purple mb-8 flex items-center">
                <i class="fas fa-bolt mr-3"></i> TRENDING NOW
            </h2>
            <div id="trendingGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6"></div>
        </div>

        <div class="mb-16">
            <h2 class="futuristic-font text-3xl font-bold neon-text-blue mb-8 flex items-center">
                <i class="fas fa-star mr-3"></i> MOST POPULAR
            </h2>
            <div id="popularGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-black/90 border-t border-purple-900/50 py-12 px-6 text-center">
        <div class="container mx-auto">
            <div class="flex justify-center items-center space-x-2 mb-6">
                <i class="fas fa-rocket text-xl neon-text-blue"></i>
                <span class="futuristic-font text-xl font-bold neon-text-purple">NEON<span class="neon-text-blue">ANIME</span></span>
            </div>
            <p class="text-gray-500 text-sm max-w-md mx-auto">
                Futuristic anime streaming platform powered by Anilist and Consumet.
            </p>
            <div class="mt-8 text-gray-600 text-xs">
                &copy; 2025 NeonAnime. For educational purposes only.
            </div>
        </div>
    </footer>

    <!-- Modal -->
    <div id="animeModal" class="fixed inset-0 z-[60] hidden overflow-y-auto bg-black/95 backdrop-blur-sm">
        <div class="min-h-screen px-4 py-12">
            <div class="container mx-auto bg-gray-900/80 rounded-2xl border border-purple-500/30 p-6 md:p-10 relative">
                <button id="closeModal" class="absolute top-6 right-6 text-gray-400 hover:text-white text-3xl transition-colors">
                    <i class="fas fa-times"></i>
                </button>
                <div id="modalContent" class="custom-scrollbar">
                    <!-- Detail content injected by JS -->
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
<p style="border-radius: 8px; text-align: center; font-size: 12px; color: #fff; margin-top: 16px;position: fixed; left: 8px; bottom: 8px; z-index: 10; background: rgba(0, 0, 0, 0.8); padding: 4px 8px;">Made with <img src="https://enzostvs-deepsite.hf.space/logo.svg" alt="DeepSite Logo" style="width: 16px; height: 16px; vertical-align: middle;display:inline-block;margin-right:3px;filter:brightness(0) invert(1);"><a href="https://enzostvs-deepsite.hf.space" style="color: #fff;text-decoration: underline;" target="_blank" >DeepSite</a> - 🧬 <a href="https://enzostvs-deepsite.hf.space?remix=Addex/anime" style="color: #fff;text-decoration: underline;" target="_blank" >Remix</a></p></body>
</html>
